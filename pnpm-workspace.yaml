packages:
  - fe

configDependencies:
  pnpm-plugin-sku: '0.1.0+sha512-brDwXaOAUEzjoCnijKhgyJZhSRtkl6jWC2crbF1i6BsvVvJ/jT4TQGnz+8ZqXK9OwPudOq7C37qGVMfe0Xszzg=='
publicHoistPattern:
  - '@types*'
  - '*eslint*'
  - '*prettier*'
  - esbuild
  - jest
  - tsconfig-seek
allowBuilds:
  sku: true
  '@swc/core': false
  core-js-pure: false
  esbuild: false
  unrs-resolver: false
blockExoticSubdeps: true
minimumReleaseAge: 4320
pmOnFail: error
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
